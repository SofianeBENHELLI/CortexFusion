[project]
name = "cortex-core"
version = "0.1.0"
description = "Independent governed knowledge service for Cortex Fusion"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "pg8000>=1.31,<2",
  "alembic>=1.15,<2",
  "PyJWT[crypto]>=2.10,<3",
  "mcp>=1.12,<2",
]

[project.scripts]
cortex = "cortex_core.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
