[package]
name = "cortex-rust-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jsonschema = { version = "0.55", default-features = false, features = ["arbitrary-precision"] }
rmcp = { version = "3.2", default-features = false, features = ["server", "transport-streamable-http-server"] }
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
http = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
ryu = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
uuid = { version = "1", features = ["serde", "v4"] }

