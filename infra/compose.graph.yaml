# Optional synthetic TerminusDB for graph snapshots, the same pinned image as CI.
# Kept apart from compose.yaml so a PostgreSQL-only setup needs no graph password.
services:
  terminus:
    image: terminusdb/terminusdb-server@sha256:385faf298ad77aaf2d4d6df5e84a4cbe3596d01dab2e3b991af905639ae56388
    environment:
      TERMINUSDB_ADMIN_PASS: ${TERMINUSDB_ADMIN_PASS:?Set a local TerminusDB admin password}
      TERMINUSDB_SERVER_PORT: "6363"
    ports:
      - "127.0.0.1:6363:6363"
