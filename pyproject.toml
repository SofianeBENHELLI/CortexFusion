[project]
name = "cortexfusion-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["cortex-core"]

[tool.uv.workspace]
members = ["services/core"]

[tool.uv.sources]
cortex-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.12,<1", "jsonschema>=4.23,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
