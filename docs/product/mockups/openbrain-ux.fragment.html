function captureDraft(){q('#ob-content').querySelectorAll('input[name],textarea[name]').forEach(el=>draft[el.name]=el.value)}
function message(s){q('#ob-message').textContent=s}
function modal(title,html,callback,confirm='Confirmer la simulation'){lastFocus=document.activeElement;pending=callback;q('#ob-dialog-title').textContent=title;q('#ob-dialog-body').innerHTML=html;q('#ob-confirm').textContent=confirm;q('#ob-overlay').hidden=false;q('#ob-overlay [data-act=cancel]').focus()}
function closeModal(){q('#ob-overlay').hidden=true;pending=null;if(lastFocus?.isConnected)lastFocus.focus()}
function required(names){captureDraft();const missing=names.filter(n=>!draft[n]?.trim());if(missing.length){message('Complétez les champs requis avant de poursuivre. Aucun résultat n’a été simulé.');const el=q(`[name="${missing[0]}"]`);if(el)el.focus();return false}return true}
function perform(a){captureDraft();switch(a){
case'cancel':closeModal();break;
case'profile':modal('Votre espace personnel','<p>Alex · identité humaine fictive · organisation Atelier Démo</p><p>Les rôles disponibles dans cette maquette représentent des acteurs de conception. Le produit réel ne propose que vos accès vérifiés.</p>',()=>{state.scenario='expired';render();save();return true},'Simuler la déconnexion');break;
case'search':{const query=(draft['search-text']||'').trim().toLowerCase();const hits=/délai|delai|remboursement|t-104|p-18/.test(query);q('#ob-search-results').innerHTML=hits?panel('3 résultats synthétiques',row('Revoir la règle de remboursement','T-104 · tâche','Proposée','E03')+row('Corriger le délai','P-18/r3','En revue','E15')+row('Procédure de remboursement','Source r2','Preuve','E16')):panel('Aucun résultat','<p>Aucun élément de la fixture ne correspond. Essayez « délai » ou « remboursement ».</p>');message(hits?'3 résultats synthétiques.':'Aucun résultat dans cette fixture.');break;}
case'read-notifications':message('Simulation : notifications marquées lues. Les tâches restent ouvertes.');break;
case'back':go(backScreen);break;
case'reset':draft={};Object.assign(state,{screen:'E02',role:'contributor',task:'Proposée',approved:false,published:false,verified:false,closed:false,feedback:false,shared:false,scenario:'normal',taskFilter:'Toutes'});render();save();break;
case'enter':{const role=q('[name=entry-role]').value;state.role=Object.keys(names).find(k=>names[k]===role)||'contributor';go(nav[state.role][0][0]);break}
case'accept':state.task='En cours';render();message('Simulation : mission prise en charge. Aucun changement réel.');break;
case'refuse':case'block':case'clarify':case'changes':case'reject':case'defer':case'close-nochange':modal(a==='refuse'?'Refuser la mission':a==='block'?'Déclarer un blocage':a==='reject'?'Refuser la proposition':a==='defer'?'Différer la décision':a==='close-nochange'?'Clore sans changement':'Préciser la demande',area('Motif requis','modal-reason'),()=>{const reason=q('[name=modal-reason]').value.trim();if(!reason){q('[name=modal-reason]').focus();return false}if(a==='refuse')state.task='À affecter';if(a==='block')state.task='Bloquée';render();message('Simulation : motif consigné, prochaine responsabilité informée.');return true});break;
case'submit':if(required(['proposal-title','proposal-body','proposal-reason','proposal-evidence']))modal('Soumettre une proposition',`<p>P-18 · nouvelle révision candidate. La source et les droits seront vérifiés côté service.</p>${note('Soumettre ne publie pas.')}`,()=>{go('E05');message('Simulation : proposition soumise pour avis.');return true});break;
case'review':if(required(['opinion-reason']))modal('Enregistrer l’avis',`<p>Votre avis concerne P-18/r3. Il sera lié à cette révision.</p>${note('L’owner garde la décision finale.')}`,()=>{go('E03');message('Simulation : avis enregistré, décision owner attendue.');return true});break;
case'assign':if(required(['assignment-title','assignment-result']))modal('Proposer la mission',`<dl><dt>Responsable</dt><dd>${esc(q('[name=assignee]').value)}</dd><dt>Objectif</dt><dd>${esc(draft['assignment-title'])}</dd><dt>Résultat</dt><dd>${esc(draft['assignment-result'])}</dd></dl>${note('L’affectation ne donne pas accès à de nouvelles sources.')}`,()=>{state.task='Proposée';go('E03',true);message('Simulation : mission proposée, acceptation attendue.');return true});break;
case'import':if(required(['import-title','import-text']))modal('Vérifier l’import',`<p>${esc(draft['import-title'])} · collection Procédures</p><p>Le produit contrôlera taille, format, doublon et droits avant lancement. Cette simulation montre un résultat partiel.</p>`,()=>{go('E11');return true},'Simuler le traitement');break;
case'retry-import':modal('Reprendre l’élément échoué','<p>1 élément sur 3 est éligible. Les 2 sources réussies restent inchangées. Un fichier illisible nécessite une nouvelle pièce.</p>',()=>{go('E10');message('Préparez la pièce corrigée ; aucune réingestion des réussites.');return true});break;
case'run':modal('Lancer une campagne synthétique','<p>Banque r4 · corpus v13 · méthode M1 · 10 questions attendues. Aucun fournisseur externe.</p>',()=>{go('E13');return true},'Voir le résultat simulé');break;
case'owner-preview':state.role='owner';render();save();message('Atelier : acteur fictif owner sélectionné. Aucun droit réel modifié.');break;
case'approve':if(required(['decision-reason']))modal('Approuver P-18 · révision 3','<dl><dt>Acteur</dt><dd>Morgan · owner</dd><dt>Domaine</dt><dd>Procédures · fictif</dd><dt>Effet</dt><dd>Approuver la révision, sans publier</dd></dl>'+note('Confirmation humaine indépendante à raccorder dans le produit. Aucun reçu réel n’est signé ici.'),()=>{state.approved=true;render();message('Simulation : approuvée, pas encore publiée.');return true},'Simuler l’approbation');break;
case'publish':if(!state.approved){message('La révision doit être approuvée avant publication.');break}modal('Publier P-18 · révision 3','<p>Version de départ v12 → nouvelle version v13. La commande doit revérifier droits, révision, sources et préconditions.</p>'+note('Le scénario suppose les préconditions satisfaites ; aucun savoir réel ne sera publié.'),()=>{state.published=true;go('E17');return true},'Simuler la publication');break;
case'verify':state.verified=true;render();message('Simulation : question ciblée réussie. Les autres régressions restent dans leurs tâches.');break;
case'resolve':if(!state.published||!state.verified){message('Publication et recontrôle sont requis.');break}modal('Clore et préparer le retour',`<p>${esc(draft.resolution||'Correction vérifiée sur la question ciblée.')}</p>`+note('Seule la conclusion partageable est destinée au déclarant.'),()=>{state.closed=true;render();message('Simulation : dossier clos ; suivi disponible au déclarant.');return true});break;
case'feedback':modal('Signaler une erreur',area('Votre commentaire requis','feedback-comment','Le délai semble avoir changé à 30 jours.')+'<label class="ob-check"><input type="checkbox" id="ob-share">Partager ce commentaire et la référence avec l’équipe Procédures</label>'+note('Le reste de la conversation n’est pas partagé.'),()=>{if(!q('[name=feedback-comment]').value.trim()){q('[name=feedback-comment]').focus();return false}state.feedback=true;state.shared=q('#ob-share').checked;render();message('Simulation : reçu de feedback disponible.');return true},'Simuler l’envoi');break;
case'positive':state.feedback=true;render();message('Simulation : feedback positif personnel enregistré. Il ne prouve pas la vérité du concept.');break;
case'follow':message(state.closed?'Simulation : correction vérifiée, conclusion partageable disponible.':'Simulation : dossier en cours d’examen. Aucune note interne exposée.');break;
case'observations':modal('Observations facultatives','<label class="ob-check"><input type="checkbox">Autoriser le client à transmettre les événements documentés</label>'+note('Option distincte du partage des commentaires. Aucun scroll ni silence n’est interprété comme satisfaction.'),()=>{message('Préférence de démonstration examinée ; aucune collecte réelle.');return true},'Fermer la simulation');break;
case'recover':{const old=state.scenario;state.scenario='normal';if(old==='denied')go('E01');else{render();message(old==='uncertain'?'Simulation : le reçu doit être relu ; aucun nouvel envoi. Le scénario courant est restauré.':old==='conflict'?'Simulation : version actuelle présentée ; décision à reprendre.':'Scénario nominal restauré.')}save();break}
case'duplicate':modal('Comparer avant rapprochement','<p>SIG-42 et SIG-39 concernent le même délai. Conserver les deux événements et la date initiale la plus ancienne.</p>',()=>{message('Simulation : rapprochement proposé, événements conservés.');return true});break;
case'access':modal('Effets du changement d’accès','<p>Exemple : 2 tâches pourraient devenir orphelines. Le produit doit vérifier les droits et le dernier owner avant confirmation.</p>'+note('Aucun rôle ni accès réel ne sera modifié.'),()=>{message('Simulation : changement préparé, pas appliqué.');return true},'Conserver le scénario');break;
case'reference':case'objective':modal(a==='reference'?'Préparer une référence':'Préparer un objectif',field('Intitulé requis','new-title')+area('Critères attendus','new-criteria'),()=>{if(!q('[name=new-title]').value.trim()){q('[name=new-title]').focus();return false}message('Simulation : brouillon préparé, approbation owner encore nécessaire.');return true},'Simuler le brouillon');break;
case'compare':modal('Comparer les campagnes','<p>v12 : 7 réussites, 2 échecs, 1 erreur. v13 : 8 réussites, 1 échec, 1 erreur.</p><p>Banque r4 et méthode M1 identiques dans cette fixture. La régression restante doit être traitée séparément.</p>',()=>true,'Terminer la comparaison');break;
case'agent-report':modal('Rapport candidat A-09','<p>Divergence de délai repérée. Source r2 citée ; analyse à confirmer par l’expert. Aucune approbation humaine ni publication.</p>',()=>{go('E08');return true},'Confier la vérification');break;
case'agent-stop':modal('Demander l’arrêt de la mission','<p>Conserver les résultats déjà produits ; arrêter les travaux futurs selon le mandat. L’arrêt ne supprime pas l’historique.</p>',()=>{message('Simulation : demande d’arrêt enregistrée, résultat à vérifier.');return true});break;
case'mcp-test':message('Diagnostic simulé : Q/F/S à qualifier avec le client réel. O/N facultatifs. Aucun appel réseau effectué.');break;
case'incident':modal('Préparer une reprise ciblée','<p>Relire l’état de la tentative, vérifier la source puis reprendre la seule question en erreur. Aucun replay global.</p>',()=>{go('E13');message('Simulation : plan de reprise disponible.');return true});break;
case'config':modal('Examiner la configuration',select('Changement synthétique','config-change',['Délai de lecture technique'])+field('Valeur proposée','config-value','30 secondes')+note('Une validation, une version et un retour arrière seront requis avant activation réelle.'),()=>{message('Simulation : changement à valider ; aucune configuration appliquée.');return true},'Préparer la modification');break;
}}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='ob-confirm'){const callback=pending;if(callback&&callback()!==false)closeModal();return}if(b.dataset.go)go(b.dataset.go);if(b.dataset.act)perform(b.dataset.act);if(b.dataset.filter){state.taskFilter=b.dataset.filter;render()}});
q('#ob-screen').addEventListener('change',e=>go(e.target.value,true));q('#ob-role').addEventListener('change',e=>{state.role=e.target.value;go(nav[state.role][0][0])});q('#ob-domain').addEventListener('change',()=>{draft={};state.scenario='empty';render();save()});for(const [id,key] of [['ob-state','scenario'],['ob-theme','theme'],['ob-format','format']])q('#'+id).addEventListener('change',e=>{captureDraft();state[key]=e.target.value;render();save()});
root.addEventListener('keydown',e=>{if(q('#ob-overlay').hidden)return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const items=[...q('#ob-overlay').querySelectorAll('button,input,select,textarea,a[href]')].filter(el=>!el.disabled);const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('openai:set_globals',e=>{Object.assign(state,validSaved(e.detail?.globals?.widgetState));render()});render();if(globalThis.Tweak){const t=new Tweak({container:q('#ob-product'),onChange:render});t.addSelect(design,'density',{label:'Densité du contenu',options:['Confortable','Compacte']})}
})();
</script>
