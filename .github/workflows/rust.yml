name: Rust migration checks
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'services/rust-core/**'
      - 'scripts/verify_rust_http.py'
      - 'scripts/verify_rust_graph.py'
      - 'scripts/verify_rust_mcp.py'
      - 'scripts/verify_rust_publication.py'
      - 'scripts/verify_rust_sources.py'
      - 'scripts/verify_rust_proposals.py'
      - 'scripts/verify_rust_retrieval.py'
      - 'scripts/verify_rust_signals.py'
      - 'scripts/generate_rust_lexical.py'
      - 'packages/contracts/interactions.json'
      - 'packages/contracts/mcp-tools.json'
      - 'services/core/migrations/**'
      - '.github/workflows/rust.yml'
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      terminus:
        image: terminusdb/terminusdb-server@sha256:385faf298ad77aaf2d4d6df5e84a4cbe3596d01dab2e3b991af905639ae56388
        ports: ['6363:6363']
        env:
          TERMINUSDB_ADMIN_PASS: synthetic-spike-password
          TERMINUSDB_SERVER_PORT: '6363'
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: cortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cortex_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CORTEX_MIGRATION_DATABASE_URL: postgresql+pg8000://postgres:synthetic-ci-password@localhost:5432/cortex_test
      CORTEX_TEST_ADMIN_URL: postgresql+pg8000://postgres:synthetic-ci-password@localhost:5432/cortex_test
      CORTEX_RUST_DATABASE_URL: postgresql://cortex_app:synthetic-app-password@localhost:5432/cortex_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Verify native code
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies and restricted database role
        run: |
          python -m pip install uv==0.12.10
          uv sync --locked
          uv run python - <<'PYCODE'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ['CORTEX_MIGRATION_DATABASE_URL']).begin() as conn:
              conn.execute(text("CREATE ROLE cortex_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'synthetic-app-password'"))
          PYCODE
          uv run alembic upgrade head
          uv run python scripts/generate_rust_lexical.py
          git diff --exit-code -- services/rust-core/src/lexical-unicode.json
      - name: Verify native HTTP with real tenant isolation
        run: |
          cargo build --workspace --locked
          uv run python scripts/verify_rust_http.py --output "$RUNNER_TEMP/rust-http.json"
          cat "$RUNNER_TEMP/rust-http.json"
      - name: Verify immutable typed Rust snapshots with real TerminusDB
        env:
          CORTEX_SPIKE_TERMINUS_PASSWORD: synthetic-spike-password
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --user admin:synthetic-spike-password http://127.0.0.1:6363/api/info > /dev/null; then break; fi
            sleep 2
          done
          cargo test --workspace --locked --test terminus_engine -- --ignored --nocapture
      - name: Verify native graph HTTP, manifests and current source access
        env:
          CORTEX_TERMINUS_URL: http://127.0.0.1:6363
          CORTEX_TERMINUS_USER: admin
          CORTEX_TERMINUS_PASSWORD: synthetic-spike-password
        run: |
          uv run python scripts/verify_rust_http.py --output "$RUNNER_TEMP/rust-graph-http.json"
          cat "$RUNNER_TEMP/rust-graph-http.json"
