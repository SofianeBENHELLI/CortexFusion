name: Frontend mock
on:
  push:
    paths: ['apps/console/**', 'packages/contracts/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/frontend-mock.yml']
  pull_request:
    paths: ['apps/console/**', 'packages/contracts/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/frontend-mock.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@10.15.1
          pnpm install --frozen-lockfile
      - name: Typecheck, build and verify mock contracts
        run: |
          pnpm console:build
          pnpm console:test
      - name: Verify browser journeys without a backend
        run: |
          pnpm --filter @cortexfusion/console exec playwright install --with-deps chromium
          pnpm --filter @cortexfusion/console test:e2e
