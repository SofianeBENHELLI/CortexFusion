name: Synthetic coordinated restore
on:
  pull_request:
    paths:
      - 'scripts/verify_coordinated_restore.py'
      - 'scripts/verify_rust_publication_recovery.py'
      - 'scripts/verify_rust_configured.py'
      - 'services/rust-core/**'
      - 'services/core/migrations/**'
      - 'packages/contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/coordinated-restore.yml'
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build native backend and install fixture dependencies
        run: |
          cargo build --workspace --locked
          python -m pip install uv==0.12.10
          uv sync --locked
      - name: Restore synthetic SQL and immutable graph commits into new stores
        run: uv run python scripts/verify_coordinated_restore.py --synthetic-only --output "$RUNNER_TEMP/coordinated-restore.json"
      - name: Report qualification result
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/coordinated-restore.json" ]; then
            cat "$RUNNER_TEMP/coordinated-restore.json"
          fi
