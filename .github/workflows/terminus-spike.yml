name: Synthetic TerminusDB spike
on:
  pull_request:
    paths:
      - 'experiments/terminusdb/**'
      - '.github/workflows/terminus-spike.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      terminus:
        image: terminusdb/terminusdb-server@sha256:385faf298ad77aaf2d4d6df5e84a4cbe3596d01dab2e3b991af905639ae56388
        ports: ['6363:6363']
        env:
          TERMINUSDB_ADMIN_PASS: synthetic-spike-password
          TERMINUSDB_SERVER_PORT: '6363'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked tooling
        run: |
          python -m pip install uv==0.12.10
          uv sync --locked
      - name: Wait for isolated engine
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --user admin:synthetic-spike-password http://127.0.0.1:6363/api/info > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Record actual container image identity
        run: docker image inspect terminusdb/terminusdb-server@sha256:385faf298ad77aaf2d4d6df5e84a4cbe3596d01dab2e3b991af905639ae56388 --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/terminus-image.json"
      - name: Exercise synthetic versioned knowledge
        env:
          CORTEX_SPIKE_TERMINUS_PASSWORD: synthetic-spike-password
        run: uv run python experiments/terminusdb/probe.py --output "$RUNNER_TEMP/terminus-probe.json"
      - name: Show synthetic result without source contents
        if: always()
        run: |
          test ! -f "$RUNNER_TEMP/terminus-image.json" || cat "$RUNNER_TEMP/terminus-image.json"
          test ! -f "$RUNNER_TEMP/terminus-probe.json" || cat "$RUNNER_TEMP/terminus-probe.json"
