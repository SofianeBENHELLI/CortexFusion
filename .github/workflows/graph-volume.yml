name: Synthetic graph volume
on:
  pull_request:
    paths:
      - 'scripts/benchmark_rust_graph.py'
      - 'scripts/verify_*.py'
      - 'packages/contracts/**'
      - 'services/core/src/cortex_core/service.py'
      - 'tests/test_graph_benchmark_protocol.py'
      - 'services/rust-core/**'
      - 'services/core/migrations/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/graph-volume.yml'
permissions:
  contents: read
jobs:
  volume:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      terminus:
        image: terminusdb/terminusdb-server@sha256:385faf298ad77aaf2d4d6df5e84a4cbe3596d01dab2e3b991af905639ae56388
        ports: ['6363:6363']
        env:
          TERMINUSDB_ADMIN_PASS: synthetic-spike-password
          TERMINUSDB_SERVER_PORT: '6363'
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: cortex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cortex_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CORTEX_MIGRATION_DATABASE_URL: postgresql+pg8000://postgres:synthetic-ci-password@localhost:5432/cortex_test
      CORTEX_TEST_ADMIN_URL: postgresql+pg8000://postgres:synthetic-ci-password@localhost:5432/cortex_test
      CORTEX_RUST_DATABASE_URL: postgresql://cortex_app:synthetic-app-password@localhost:5432/cortex_test
      CORTEX_TERMINUS_URL: http://127.0.0.1:6363
      CORTEX_TERMINUS_USER: admin
      CORTEX_TERMINUS_PASSWORD: synthetic-spike-password
      CORTEX_BENCHMARK_COMMIT: ${{ github.event.pull_request.head.sha }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build optimized backend and prepare isolated SQL
        run: |
          cargo build --release --locked --bin cortex-rust-core
          python -m pip install uv==0.12.10
          uv sync --locked
          uv run python - <<'PYCODE'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ['CORTEX_MIGRATION_DATABASE_URL']).begin() as conn:
              conn.execute(text("CREATE ROLE cortex_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'synthetic-app-password'"))
          PYCODE
          uv run alembic upgrade head
          uv run pytest tests/test_graph_benchmark_protocol.py -q
      - name: Measure synthetic immutable graph workloads
        run: |
          timeout --signal=TERM --kill-after=45s 900s uv run python scripts/benchmark_rust_graph.py --synthetic-only --build-profile release --output "$RUNNER_TEMP/graph-volume.json"
      - name: Measure native Unicode excerpt allocations
        run: cargo run --release --locked --example benchmark_excerpt
      - name: Measure shared long document workloads
        run: |
          timeout --signal=TERM --kill-after=45s 900s uv run python scripts/benchmark_rust_graph.py --synthetic-only --build-profile release --source-profile shared_long --output "$RUNNER_TEMP/graph-volume-long.json"
      - name: Measure companion token reuse separately
        run: |
          timeout --signal=TERM --kill-after=45s 900s uv run python scripts/benchmark_rust_graph.py --synthetic-only --build-profile release --sizes 2000 --source-profile shared_long --identity-mode per_cell --output "$RUNNER_TEMP/graph-volume-session.json"
      - name: Report measurements and qualification limits
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/graph-volume.json" ]; then
            cat "$RUNNER_TEMP/graph-volume.json"
          fi
          if [ -f "$RUNNER_TEMP/graph-volume-long.json" ]; then
            cat "$RUNNER_TEMP/graph-volume-long.json"
          fi
          if [ -f "$RUNNER_TEMP/graph-volume-session.json" ]; then
            cat "$RUNNER_TEMP/graph-volume-session.json"
          fi
