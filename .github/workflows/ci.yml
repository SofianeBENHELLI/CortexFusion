name: Core and contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: cortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cortex_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CORTEX_MIGRATION_DATABASE_URL: postgresql+pg8000://postgres:synthetic-ci-password@localhost:5432/cortex_test
      CORTEX_TEST_ADMIN_URL: postgresql+pg8000://postgres:synthetic-ci-password@localhost:5432/cortex_test
      CORTEX_TEST_DATABASE_URL: postgresql+pg8000://cortex_app:synthetic-app-password@localhost:5432/cortex_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked tooling and dependencies
        run: |
          python -m pip install uv==0.12.10
          npm install --global pnpm@10.15.1
          uv sync --locked
          pnpm install --frozen-lockfile
      - name: Provision restricted application role
        run: |
          uv run python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ['CORTEX_MIGRATION_DATABASE_URL']).begin() as conn:
              conn.execute(text("CREATE ROLE cortex_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'synthetic-app-password'"))
          PY
      - name: Migrate fresh database
        run: uv run alembic upgrade head
      - name: Verify code, contracts, invariants and licenses
        run: make test
      - name: Demonstrate approved knowledge and compensation
        run: make demo-core
